version: "2"

sql:
- schema: "sql/migrations"
  queries: "sql/queries"
  engine: "postgresql"

  gen:
    go:
      package: "sqlc"
      out: "internal/db/sqlc"

      sql_package: "pgx/v5"

      emit_json_tags: true
      emit_interface: true
      emit_prepared_queries: true
      emit_empty_slices: true
      emit_exact_table_names: false
      emit_result_struct_pointers: true

      overrides:
        - db_type: "uuid"
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"

        - db_type: "timestamptz"
          go_type: "time.Time"

        - db_type: "timestamp"
          go_type: "time.Time"
        
        - db_type: "float8"
          go_type: "float64"

        - db_type: "pg_catalog.float8"
          go_type: "float64"

        - db_type: "double precision"
          go_type: "float64"
        
        